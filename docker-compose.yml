services:
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "max_connections=20"]
    environment:
      POSTGRES_DB: todotest
      POSTGRES_USER: todotest
      POSTGRES_PASSWORD: todotest
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todotest -d todotest"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  gateway:
    build: ./services/gateway
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://todotest:todotest@postgres:5432/todotest
      PORT: 3000
    ports:
      - "3000:3000"
